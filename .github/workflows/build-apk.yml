
name: Build Jeevad V17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Android project
        run: |
          unzip -o VOTERS_JEEWAD_V17_ANDROID_NEW_PROJECT.zip
          ls -la jeevad_android_v17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: jeevad_android_v17
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jeevad-V17-APK
          path: jeevad_android_v17/app/build/outputs/apk/debug/app-debug.apk
